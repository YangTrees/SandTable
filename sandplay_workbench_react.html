<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>心理沙盘 3D 核心操作台</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap">
  <script src="https://fastly.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://fastly.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://fastly.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://fastly.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="assets/generated/sandplay_library.js"></script>
  <style>
    :root {
      color-scheme: light;
      --sand: #ead8a6;
      --sand-deep: #c99f62;
      --wood: #b9824d;
      --wood-deep: #7b4e2c;
      --water: #2b8fd2;
      --ink: #365063;
    }
    html, body, #root { height: 100%; }
    body {
      margin: 0;
      overflow: auto;
      font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(1200px 760px at 12% -10%, rgba(255,231,193,.78), transparent 54%),
        radial-gradient(980px 680px at 96% 0%, rgba(148,211,216,.70), transparent 52%),
        radial-gradient(1000px 760px at 50% 112%, rgba(117,175,190,.42), transparent 62%),
        linear-gradient(132deg, #f8e6cd 0%, #f2efdf 32%, #d5e9e4 64%, #a9ced4 100%);
      background-attachment: fixed;
      color: var(--ink);
    }
    @media (min-width: 1024px) {
      body { overflow: hidden; }
    }
    .glass {
      background: rgba(255,255,255,.48);
      border: 1px solid rgba(255,255,255,.62);
      box-shadow: 0 18px 50px rgba(54,80,99,.16), inset 0 1px 0 rgba(255,255,255,.8);
      backdrop-filter: blur(18px) saturate(1.18);
      -webkit-backdrop-filter: blur(18px) saturate(1.18);
    }
    .glass-strong {
      background: rgba(255,255,255,.68);
      border: 1px solid rgba(255,255,255,.78);
      box-shadow: 0 20px 55px rgba(54,80,99,.20), inset 0 1px 0 rgba(255,255,255,.95);
      backdrop-filter: blur(24px) saturate(1.25);
      -webkit-backdrop-filter: blur(24px) saturate(1.25);
    }
    .wood-shell {
      border: 10px solid transparent;
      border-radius: 28px;
      background:
        linear-gradient(#f1d391,#c68a4d) padding-box,
        linear-gradient(135deg,#7a4829 0%,#cf9354 26%,#efc071 48%,#9a6035 74%,#60371f 100%) border-box;
      box-shadow: 0 24px 60px rgba(93,63,39,.26), inset 0 0 0 4px rgba(255,255,255,.18);
    }
    canvas { display: block; }
    .sand-canvas { background: linear-gradient(135deg, #ffe8c7 0%, #eaf3e4 44%, #bfe0dd 72%, #9acbd1 100%); }
    .sand-canvas canvas { filter: saturate(1.12) contrast(1.05); }
    textarea { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .scroll-soft::-webkit-scrollbar { width: 8px; height: 8px; }
    .scroll-soft::-webkit-scrollbar-thumb { background: rgba(120,84,49,.28); border-radius: 99px; }
    .scroll-soft::-webkit-scrollbar-track { background: rgba(255,255,255,.25); border-radius: 99px; }

    /* ===== 沙盘工作室 · 界面系统 ===== */
    :root {
      --paper: #f3ede2;
      --paper-strong: #fbf6eb;
      --ink: #2e342f;
      --ink-soft: #64695f;
      --line: rgba(46,52,47,.14);
      --line-strong: rgba(46,52,47,.25);
      --amber: #a27248;
      --amber-deep: #7d5232;
      --sage: #7c8c7f;
      --water: #2d6f8d;
      --danger: #a45d51;
      --serif: "Noto Serif SC","Songti SC","STSong",serif;
      --sans: "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
      --mono: "SFMono-Regular","Consolas","Liberation Mono",monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: auto;
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(1100px 700px at 8% -12%, rgba(255,246,229,.92), transparent 56%),
        radial-gradient(900px 620px at 96% 6%, rgba(213,228,220,.72), transparent 52%),
        radial-gradient(1000px 720px at 52% 112%, rgba(172,190,184,.34), transparent 62%),
        linear-gradient(132deg, #eee6d8 0%, #eee9dd 34%, #dde3da 68%, #cbd6d1 100%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    @media (min-width: 1024px) { body { overflow: hidden; } }
    .studio-app {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 100%;
      padding: 0 24px 22px;
    }
    @media (min-width: 1024px) { .studio-app { height: 100%; overflow: hidden; } }
    .studio-header {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 78px;
      padding: 14px 2px 13px;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-seal {
      display: grid;
      place-items: center;
      width: 36px; height: 36px;
      flex: none;
      border-radius: 2px;
      background: #945c43;
      color: #f7efe2;
      font-family: var(--serif);
      font-size: 18px;
      line-height: 1;
      box-shadow: inset 0 0 0 1px rgba(255,247,234,.45), 0 4px 12px rgba(96,61,38,.18);
    }
    .brand-eyebrow {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--ink-soft);
      white-space: nowrap;
    }
    .brand-title-row { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
    .brand-title {
      margin: 3px 0 0;
      font-family: var(--serif);
      font-size: 21px;
      font-weight: 600;
      letter-spacing: .07em;
      line-height: 1.1;
      color: var(--ink);
    }
    .brand-sub {
      margin: 0;
      font-size: 10px;
      letter-spacing: .09em;
      color: var(--ink-soft);
    }
    .view-group { display: flex; align-items: center; gap: 10px; flex: none; }
    .view-label {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .view-switch { display: flex; align-items: center; border-bottom: 1px solid var(--line); }
    .seg-btn {
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      padding: 6px 10px 7px;
      font-size: 11px;
      color: var(--ink-soft);
      cursor: pointer;
      transition: color .16s ease, border-color .16s ease;
    }
    .seg-btn:hover { color: var(--ink); }
    .seg-btn.active { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
    .seg-btn.reset { margin-left: 6px; border-bottom-color: transparent; font-size: 10px; }
    .workspace { position: relative; flex: 1; min-height: 0; padding-top: 14px; }
    .stage { position: relative; min-height: 560px; }
    .studio-panel {
      border: 1px solid var(--line);
      border-radius: 4px;
      background: linear-gradient(180deg, rgba(251,247,238,.84), rgba(243,236,224,.72));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 14px 38px rgba(52,45,35,.07);
      backdrop-filter: blur(18px) saturate(1.04);
      -webkit-backdrop-filter: blur(18px) saturate(1.04);
    }
    .rail-left { width: 204px; padding: 15px 13px; }
    .rail-right { width: 250px; padding: 14px 12px; display: flex; flex-direction: column; }
    .panel-kicker {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .panel-title {
      margin: 4px 0 0;
      font-family: var(--serif);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: .05em;
      color: var(--ink);
      line-height: 1.2;
    }
    .panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
    .mode-state {
      display: none;
      align-items: center;
      gap: 5px;
      margin-top: 9px;
      font-size: 9px;
      letter-spacing: .08em;
      color: var(--ink-soft);
      white-space: nowrap;
    }
    @media (min-width: 1024px) { .mode-state { display: flex; } }
    .mode-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--sage); flex: none; }
    .mode-dot.draw { background: var(--amber); }
    .tool-list { margin-top: 12px; }
    .tool-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 7px;
      border: 0;
      border-top: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: background .16s ease, color .16s ease;
    }
    .tool-btn:first-child { border-top: 0; }
    .tool-btn:hover { background: rgba(255,255,255,.34); }
    .tool-btn.active { background: rgba(162,114,72,.085); }
    .tool-btn.active::before {
      content: "";
      position: absolute;
      left: 0; top: 8px; bottom: 8px;
      width: 2px;
      background: var(--amber);
    }
    .tool-glyph { width: 22px; height: 22px; flex: none; color: var(--ink-soft); }
    .tool-btn.active .tool-glyph { color: var(--amber-deep); }
    .tool-label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .05em; line-height: 1.2; }
    .tool-hint { display: block; margin-top: 2px; font-size: 9.5px; font-weight: 400; color: var(--ink-soft); letter-spacing: .02em; }
    .rail-rule { margin: 13px 0; border: 0; border-top: 1px solid var(--line); }
    .brush-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .micro-label { font-size: 9px; letter-spacing: .14em; color: var(--ink-soft); text-transform: uppercase; }
    .mono-value { font-family: var(--mono); font-size: 11px; color: var(--ink); letter-spacing: .04em; }
    .brush-range {
      width: 100%;
      height: 18px;
      margin: 7px 0 0;
      appearance: none;
      background: transparent;
      cursor: pointer;
      accent-color: var(--amber);
    }
    .brush-range::-webkit-slider-runnable-track { height: 2px; background: rgba(46,52,47,.18); }
    .brush-range::-webkit-slider-thumb {
      appearance: none;
      width: 13px; height: 13px;
      margin-top: -5.5px;
      border-radius: 50%;
      border: 1px solid var(--amber-deep);
      background: var(--paper-strong);
      box-shadow: 0 1px 4px rgba(46,42,33,.16);
    }
    .brush-range::-moz-range-track { height: 2px; background: rgba(46,52,47,.18); }
    .brush-range::-moz-range-thumb {
      width: 13px; height: 13px;
      border: 1px solid var(--amber-deep);
      border-radius: 50%;
      background: var(--paper-strong);
    }
    .brush-scale { display: flex; justify-content: space-between; margin-top: 1px; font-family: var(--mono); font-size: 8px; color: rgba(46,52,47,.42); }
    .shortcuts { color: var(--ink-soft); font-size: 9.5px; line-height: 1.9; }
    .shortcut-line { display: flex; align-items: center; gap: 6px; }
    .kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      padding: 1px 4px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: rgba(255,255,255,.38);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 8px;
      line-height: 1.4;
      white-space: nowrap;
    }
    .count-mark { font-family: var(--serif); font-size: 20px; color: var(--ink); line-height: 1; }
    .count-mark small { font-family: var(--mono); font-size: 8px; letter-spacing: .1em; color: var(--ink-soft); margin-left: 3px; }
    .panel-note { margin: 8px 0 10px; font-size: 9.5px; letter-spacing: .04em; color: var(--ink-soft); }
    .specimen-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding-right: 2px;
    }
    .specimen-taxonomy {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin: 0 0 9px;
      padding-bottom: 9px;
      border-bottom: 1px solid var(--line);
    }
    .taxon-chip {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 23px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: rgba(255,255,255,.26);
      padding: 0 7px;
      color: var(--ink-soft);
      font-family: var(--mono);
      font-size: 8px;
      line-height: 1;
      letter-spacing: .04em;
      cursor: pointer;
      transition: background .16s ease, color .16s ease, border-color .16s ease;
    }
    .taxon-chip:hover { border-color: rgba(162,114,72,.5); color: var(--ink); }
    .taxon-chip.active {
      background: var(--ink);
      border-color: var(--ink);
      color: #f8f3e9;
    }
    .taxon-chip .taxon-icon {
      display: block;
      width: 15px;
      height: 15px;
      flex: none;
      object-fit: contain;
      opacity: .8;
    }
    .taxon-chip.active .taxon-icon { filter: brightness(0) invert(1); opacity: .92; }
    .specimen-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 84px;
      padding: 9px 4px 6px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: rgba(255,252,245,.62);
      text-align: center;
      cursor: grab;
      transition: border-color .16s ease, background .16s ease;
    }
    .specimen-card:hover { border-color: rgba(162,114,72,.48); background: rgba(255,252,245,.9); }
    .specimen-card:focus, .specimen-card:focus-visible { outline: none; }
    .specimen-card:active { cursor: grabbing; }
    .specimen-index {
      position: absolute;
      left: 5px; top: 4px;
      font-family: var(--mono);
      font-size: 8px;
      line-height: 1;
      color: rgba(46,52,47,.34);
    }
    .specimen-glyph { font-size: 23px; line-height: 1; margin-top: 2px; }
    .specimen-image { display: block; width: 38px; height: 38px; margin: 0 auto; object-fit: contain; filter: drop-shadow(0 3px 4px rgba(82,56,28,.16)); }
    .specimen-label {
      display: -webkit-box;
      width: 100%;
      min-height: 22px;
      max-height: 22px;
      margin-top: 5px;
      padding: 0 2px;
      overflow: hidden;
      color: var(--ink-soft);
      font-size: 9px;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: .02em;
      text-align: center;
      overflow-wrap: anywhere;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .rail-actions { flex: none; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
    .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .ghost-btn, .ghost-danger {
      border: 1px solid var(--line);
      border-radius: 3px;
      background: transparent;
      padding: 8px 6px;
      font-size: 10px;
      color: var(--ink-soft);
      cursor: pointer;
      transition: background .16s ease, color .16s ease, border-color .16s ease;
    }
    .ghost-btn:hover { background: rgba(255,255,255,.4); color: var(--ink); }
    .ghost-danger { color: var(--danger); border-color: rgba(164,93,81,.26); }
    .ghost-danger:hover { background: rgba(164,93,81,.08); }
    .primary-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-top: 8px;
      padding: 10px 11px;
      border: 0;
      border-radius: 3px;
      background: #303630;
      color: #f7f0e3;
      text-align: left;
      cursor: pointer;
      transition: background .16s ease;
    }
    .primary-btn:hover { background: #414a42; }
    .primary-label { display: block; font-family: var(--serif); font-size: 13px; font-weight: 600; letter-spacing: .14em; line-height: 1.2; }
    .primary-meta { display: block; margin-top: 2px; font-family: var(--mono); font-size: 8px; letter-spacing: .08em; opacity: .66; }
    .primary-arrow { font-size: 14px; opacity: .66; }
    .wood-shell {
      position: relative;
      height: 100%;
      min-height: 560px;
      padding: 8px;
      border: 6px solid #d8bd93;
      border-radius: 20px;
      background: #f2e8d8;
      overflow: hidden;
      box-shadow: 0 18px 46px rgba(64,48,33,.16), inset 0 0 0 1px rgba(255,255,255,.55);
    }
    .sand-canvas {
      position: relative;
      height: 100%;
      min-height: 520px;
      overflow: hidden;
      border-radius: 12px;
      cursor: crosshair;
      touch-action: none;
      background: linear-gradient(135deg, #f3e7d3 0%, #e9eadf 44%, #d5dfda 72%, #c5d2d0 100%);
    }
    .sand-canvas canvas { filter: saturate(1.06) contrast(1.04); }
    .stage-label {
      position: absolute;
      left: 50%; top: 13px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 9px;
      border: 1px solid rgba(46,52,47,.13);
      border-radius: 2px;
      background: rgba(247,242,232,.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--ink-soft);
      white-space: nowrap;
    }
    .stage-label strong { color: var(--ink); font-weight: 600; }
    .stage-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--amber); flex: none; }
    .stage-sep { color: rgba(46,52,47,.34); }
    .inspector-bar {
      position: absolute;
      left: 50%; bottom: 18px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 5px 6px 5px 10px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 3px;
      background: rgba(39,44,40,.88);
      box-shadow: 0 14px 32px rgba(20,20,16,.24);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .inspector-name { padding-right: 8px; font-size: 11px; letter-spacing: .1em; color: #e2c58f; white-space: nowrap; }
    .inspector-btn {
      width: 26px; height: 26px;
      border: 0;
      border-radius: 2px;
      background: transparent;
      color: #efe7d8;
      font-size: 13px;
      cursor: pointer;
    }
    .inspector-btn:hover { background: rgba(255,255,255,.09); }
    .inspector-delete {
      height: 26px;
      margin-left: 4px;
      padding: 0 7px;
      border: 0;
      border-left: 1px solid rgba(255,255,255,.14);
      background: transparent;
      color: #e3a79d;
      font-size: 10px;
      letter-spacing: .06em;
      cursor: pointer;
    }
    .inspector-delete:hover { color: #f4c0b6; }
    .toast {
      position: fixed;
      left: 50%; bottom: 112px;
      z-index: 50;
      transform: translateX(-50%);
      padding: 8px 13px;
      border: 1px solid rgba(46,52,47,.22);
      border-left: 3px solid var(--amber);
      border-radius: 2px;
      background: rgba(249,244,234,.95);
      color: var(--ink);
      font-size: 10.5px;
      letter-spacing: .06em;
      box-shadow: 0 10px 24px rgba(24,24,20,.13);
    }
    .export-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(28,32,29,.56);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }
    .export-panel {
      width: min(1080px, 96vw);
      max-height: 92vh;
      overflow: hidden;
      border: 1px solid rgba(46,52,47,.18);
      border-radius: 5px;
      background: #f6efe3;
      box-shadow: 0 28px 70px rgba(24,22,18,.26);
    }
    .export-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 22px 13px;
      border-bottom: 1px solid var(--line);
    }
    .export-title { margin: 3px 0 0; font-family: var(--serif); font-size: 18px; font-weight: 600; letter-spacing: .04em; }
    .export-sub { margin: 4px 0 0; font-size: 9.5px; color: var(--ink-soft); }
    .export-close {
      border: 1px solid var(--line);
      border-radius: 2px;
      background: transparent;
      padding: 6px 10px;
      font-size: 10px;
      color: var(--ink-soft);
      cursor: pointer;
    }
    .export-close:hover { background: rgba(255,255,255,.38); color: var(--ink); }
    .export-body { display: grid; grid-template-columns: 340px 1fr; gap: 18px; max-height: calc(92vh - 72px); overflow: auto; padding: 16px 22px 20px; }
    @media (max-width: 900px) { .export-body { grid-template-columns: 1fr; } }
    .export-image { width: 100%; border: 1px solid var(--line); border-radius: 3px; background: #efe8dc; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .stat-card { padding-top: 8px; border-top: 1px solid var(--line-strong); }
    .stat-value { font-family: var(--serif); font-size: 18px; line-height: 1; color: var(--ink); }

    /* ===== visionOS glass restyle (VirtualFit reference) ===== */

    function App() {
      const mountRef = useRef(null);

      const brushCursorRef = useRef(null);

      const orbitRef = useRef(null);
      const orbitTargetRef = useRef(null);
      const strokeRef = useRef(null);
      const toastTimerRef = useRef(null);
      const telemetryRef = useRef({
        pageStartedAt: Date.now(),
        startedAt: null,
        firstActionAt: null,
        lastActionAt: null,
        actionCount: 0,
        actionEvents: [],
        itemAddedTotal: 0,
        itemDeletedTotal: 0,
        hesitationCount: 0,
        terrainStrokeCount: 0,
        buryActions: [],

        addHistory: {},

      });

      const [items, setItems] = useState([]);

      const [brushSize, setBrushSize] = useState(96);

      const [lightMode, setLightMode] = useState("day");

      const [exportModalOpen, setExportModalOpen] = useState(false);

      const [completionError, setCompletionError] = useState("");
      const [submitting, setSubmitting] = useState(false);
      const [toast, setToast] = useState("");
      const [sceneReady, setSceneReady] = useState(false);
      const [assetCategory, setAssetCategory] = useState("全部");
      const specimenGridRef = useRef(null);
      const hasCategoryData = useMemo(
        () => SANDPLAY_CATEGORY_DEFS.some((entry) => TEST_ICONS.some((item) => item.category === entry.key)),
        []
      );
      const categoryCounts = useMemo(() => {
        const counts = { "全部": TEST_ICONS.length };
        SANDPLAY_CATEGORY_DEFS.forEach((entry) => {

        });

      }, []);
      const visibleIcons = useMemo(() => {
        let base = TEST_ICONS;
        if (hasCategoryData && assetCategory !== "全部") {
          base = base.filter((item) => item.category === assetCategory);
        }
        return base;
      }, [assetCategory, hasCategoryData]);
      useEffect(() => {
        const node = specimenGridRef.current;
        if (!node) return undefined;
        const frame = requestAnimationFrame(() => { node.scrollTop = 1; });
        return () => cancelAnimationFrame(frame);
      }, [assetCategory, visibleIcons.length]);

      const itemsRef = useRef(items);
      const selectedIdRef = useRef(selectedId);
      const toolRef = useRef(tool);
      const brushSizeRef = useRef(brushSize);
      const viewModeRef = useRef(viewMode);
      useEffect(() => { itemsRef.current = items; }, [items]);
      useEffect(() => { selectedIdRef.current = selectedId; updateSelectionRing(); }, [selectedId]);
      useEffect(() => {
        const onKeyDown = (event) => {
          if (event.key === "Escape") setSelectedId(null);
        };
        window.addEventListener("keydown", onKeyDown);
        return () => window.removeEventListener("keydown", onKeyDown);
      }, []);
      useEffect(() => { toolRef.current = tool; }, [tool]);
      useEffect(() => { brushSizeRef.current = brushSize; }, [brushSize]);
      useEffect(() => { viewModeRef.current = viewMode; updateCamera(); }, [viewMode]);

      const showToast = useCallback((message) => {
        setToast(message);
        window.clearTimeout(toastTimerRef.current);
        toastTimerRef.current = window.setTimeout(() => setToast(""), 2200);
      }, []);
      const noteAction = (type) => {
        const t = telemetryRef.current;
        const now = Date.now();
        if (!t.startedAt) t.startedAt = now;
        if (!t.firstActionAt) t.firstActionAt = now;
        t.lastActionAt = now;
        t.actionCount += 1;
        t.actionEvents.push({ type, at_sec: Math.round((now - t.startedAt) / 1000) });
        if (t.actionEvents.length > 80) t.actionEvents = t.actionEvents.slice(-80);
      };
      const noteItemAdded = useCallback((item) => {
        const t = telemetryRef.current;
        noteAction("add");
        t.itemAddedTotal += 1;
        const key = item.source_id || item.label || item.id;
        const now = Date.now();
        t.addHistory[key] = [...(t.addHistory[key] || []), now].filter((stamp) => now - stamp <= 60000).slice(-8);
        const isPerson = /人物|角色/.test(item.category || "") || /爷爷|奶奶|爸爸|妈妈|男孩|女孩|人物/.test(item.label || "");
        if (!isPerson) return;
        const buried = (itemsRef.current || []).find((other) => (
          other.id !== item.id && Math.hypot((other.x || 0) - item.x, (other.z || 0) - item.z) < 34
        ));
        if (buried) {
          t.buryActions.push({
            source_id: item.source_id || "",
            label: item.label || "",
            buried_item_id: buried.id,
            buried_label: buried.label || "",
            at_sec: Math.round((now - t.startedAt) / 1000)
          });
          t.buryActions = t.buryActions.slice(-20);
        }
      }, []);
      const noteItemDeleted = useCallback((item) => {
        const t = telemetryRef.current;
        noteAction("delete");
        t.itemDeletedTotal += 1;
        if (!item) return;
        const key = item.source_id || item.label || item.id;
        const now = Date.now();
        const recentAdds = (t.addHistory[key] || []).filter((stamp) => now - stamp <= 60000);
        const isPerson = /人物|角色/.test(item.category || "") || /爷爷|奶奶|爸爸|妈妈|男孩|女孩|人物/.test(item.label || "");
        if (isPerson && recentAdds.length >= 2) t.destructiveLoops += 1;
      }, []);
      const noteItemMoved = useCallback((item) => {
        const t = telemetryRef.current;
        noteAction("move");
        t.hesitationCount += 1;
        if (!item) return;
        const isPerson = /人物|角色/.test(item.category || "") || /爷爷|奶奶|爸爸|妈妈|男孩|女孩|人物/.test(item.label || "");
        if (!isPerson) return;
        const buried = (itemsRef.current || []).find((other) => (
          other.id !== item.id && Math.hypot((other.x || 0) - item.x, (other.z || 0) - item.z) < 30
        ));
        if (buried) {
          t.buryActions.push({
            source_id: item.source_id || "",
            label: item.label || "",
            buried_item_id: buried.id,
            buried_label: buried.label || "",
            at_sec: Math.round((Date.now() - t.startedAt) / 1000)
          });
          t.buryActions = t.buryActions.slice(-20);
        }
      }, []);
      const buildProcessTelemetry = useCallback(() => {
        const t = telemetryRef.current;
        const now = Date.now();
        const startedAt = t.startedAt || t.pageStartedAt;
        const events = t.actionEvents.slice(-80);
        const times = events.map((event) => Number(event.at_sec) || 0);
        const intervals = times.slice(1).map((value, index) => value - times[index]).filter((value) => value >= 0);
        const longPauses = intervals.filter((value) => value >= 8);
        return {
          total_duration_sec: Math.max(1, Math.round((now - startedAt) / 1000)),
          item_added_total: t.itemAddedTotal,
          item_deleted_total: t.itemDeletedTotal,
          hesitation_count: t.hesitationCount,
          item_moved_total: t.hesitationCount,
          terrain_stroke_count: t.terrainStrokeCount,
          bury_actions: t.buryActions.slice(),
          destructive_loops: t.destructiveLoops,
          undo_count: t.undoCount,
          action_count: t.actionCount,
          first_action_at_sec: t.firstActionAt ? Math.max(0, Math.round((t.firstActionAt - t.pageStartedAt) / 1000)) : 0,
          last_action_at_sec: t.lastActionAt ? Math.max(0, Math.round((t.lastActionAt - startedAt) / 1000)) : 0,
          post_finish_idle_sec: t.lastActionAt ? Math.max(0, Math.round((now - t.lastActionAt) / 1000)) : 0,
          long_pause_count: longPauses.length,
          longest_pause_sec: longPauses.length ? Math.max(...longPauses) : 0,
          action_events: events.slice(-60)
        };
      }, []);

      const updateCamera = useCallback(() => {
        const camera = cameraRef.current;
        if (!camera) return;
        const state = cameraStateRef.current;
        const distance = cameraBaseRef.current * state.distance;
        if (viewModeRef.current === "top90") {
          camera.up.set(0, 0, -1);
          camera.position.set(0, 1260, 0.01);
        } else {
          camera.up.set(0, 1, 0);
          const polar = clamp(state.polar, 0.18, 1.32);
          const azimuth = state.azimuth;
          camera.position.set(
            distance * Math.sin(polar) * Math.sin(azimuth),
            distance * Math.cos(polar),
            distance * Math.sin(polar) * Math.cos(azimuth)
          );
        }
        camera.lookAt(0, -24, 0);
      }, []);

      const updateEdgeSkirt = useCallback(() => {
        const skirt = edgeSkirtRef.current;
        const terrain = terrainRef.current;
        if (!skirt || !terrain) return;
        const pos = skirt.geometry.attributes.position;
        for (let k = 0; k < skirt.terrainIndices.length; k += 1) {
          const topY = terrain.heights[skirt.terrainIndices[k]];
          pos.setY(skirt.topVertexIndices[k], topY);
        }
        pos.needsUpdate = true;
        skirt.geometry.computeVertexNormals();
      }, []);

      const updateTerrainGeometry = useCallback(() => {
        const terrain = terrainRef.current;
        if (!terrain) return;
        const { geometry, heights, colors } = terrain;
        const position = geometry.attributes.position;
        const color = geometry.attributes.color;
        for (let i = 0; i < position.count; i += 1) {
          position.setY(i, heights[i]);
          color.setXYZ(i, colors[i * 3], colors[i * 3 + 1], colors[i * 3 + 2]);

        position.needsUpdate = true;
        color.needsUpdate = true;

      }, [updateEdgeSkirt]);

      const heightAt = useCallback((x, z) => {
        const terrain = terrainRef.current;
        if (!terrain) return 0;
        const fx = clamp((x + WORLD.width / 2) / WORLD.width, 0, 1) * WORLD.segX;
        const fz = clamp((z + WORLD.depth / 2) / WORLD.depth, 0, 1) * WORLD.segZ;
        const x0 = Math.floor(fx), z0 = Math.floor(fz);
        const x1 = Math.min(WORLD.segX, x0 + 1), z1 = Math.min(WORLD.segZ, z0 + 1);
        const tx = fx - x0, tz = fz - z0;
        const idx = (ix, iz) => iz * (WORLD.segX + 1) + ix;
        const h00 = terrain.heights[idx(x0, z0)];
        const h10 = terrain.heights[idx(x1, z0)];
        const h01 = terrain.heights[idx(x0, z1)];
        const h11 = terrain.heights[idx(x1, z1)];
        return (h00 * (1 - tx) + h10 * tx) * (1 - tz) + (h01 * (1 - tx) + h11 * tx) * tz;
      }, []);

      const updateSelectionRing = useCallback(() => {
        const ring = selectionRingRef.current;
        if (!ring) return;
        const item = itemsRef.current.find((entry) => entry.id === selectedIdRef.current);
        if (!item) { ring.visible = false; return; }
        ring.visible = true;
        ring.position.set(item.x, heightAt(item.x, item.z) + 4, item.z);
        ring.scale.set(item.scale, item.scale, item.scale);
      }, [heightAt]);

      const updateBrushCursor = useCallback((point) => {
        const cursor = brushCursorRef.current;
        brushPointRef.current = point || null;
        if (!cursor) return;

          cursor.visible = false;
          return;
        }
        const radius = brushSizeRef.current;
        cursor.visible = true;
        cursor.position.set(point.x, heightAt(point.x, point.z) + 2.5, point.z);
        cursor.scale.set(radius, 1, radius);
      }, [heightAt]);
      useEffect(() => {
        brushSizeRef.current = brushSize;
        updateBrushCursor(brushPointRef.current);
      }, [brushSize, updateBrushCursor]);
      useEffect(() => {
        if (tool === "select") updateBrushCursor(null);
        else updateBrushCursor(brushPointRef.current);
      }, [tool, updateBrushCursor]);

      const makeSnapshot = useCallback(() => {
        const terrain = terrainRef.current;
        return {
          items: deepClone(itemsRef.current),
          selectedId: selectedIdRef.current,
          terrain: terrain ? { heights: Array.from(terrain.heights), colors: Array.from(terrain.colors) } : null
        };
      }, []);
      const pushUndo = useCallback((snapshot) => {
        if (snapshot) setUndoStack((stack) => [...stack, snapshot].slice(-20));
      }, []);
      const restoreSnapshot = useCallback((snapshot) => {
        setItems(deepClone(snapshot.items || []));
        setSelectedId(snapshot.selectedId || null);
        const terrain = terrainRef.current;
        if (terrain && snapshot.terrain) {
          terrain.heights.set(snapshot.terrain.heights);
          terrain.colors.set(snapshot.terrain.colors);
          updateTerrainGeometry();
        }
      }, [updateTerrainGeometry]);
      const undo = useCallback(() => {
        setUndoStack((stack) => {
          if (!stack.length) { showToast("暂无可撤销步骤"); return stack; }
          const next = [...stack];
          const snapshot = next.pop();
          restoreSnapshot(snapshot);
          telemetryRef.current.undoCount += 1;
          noteAction("undo");
          showToast(`已撤销，剩余 ${next.length} 步`);
          return next;
        });
      }, [restoreSnapshot, showToast]);
      const commitItems = useCallback((updater, message) => {
        const snapshot = makeSnapshot();
        setItems((current) => typeof updater === "function" ? updater(current) : updater);
        pushUndo(snapshot);
        if (message) showToast(message);
      }, [makeSnapshot, pushUndo, showToast]);

      const createTerrain = useCallback(() => {
        const geometry = new THREE.PlaneGeometry(WORLD.width, WORLD.depth, WORLD.segX, WORLD.segZ);
        geometry.rotateX(-Math.PI / 2);
        const count = geometry.attributes.position.count;
        const heights = new Float32Array(count);
        const colors = new Float32Array(count * 3);
        for (let i = 0; i < count; i += 1) {
          colors[i * 3] = 1;
          colors[i * 3 + 1] = 1;
          colors[i * 3 + 2] = 1;
        }
        geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
        const sand = makeSandTextures();
        const material = new THREE.MeshStandardMaterial({
          map: sand.colorTexture,
          bumpMap: sand.bumpTexture,
          bumpScale: 4.2,
          vertexColors: true,
          roughness: 0.98,
          metalness: 0
        });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.receiveShadow = true;
        mesh.name = "terrain";
        return { mesh, geometry, heights, colors, baseColor: new THREE.Color(1, 1, 1) };
      }, []);

      const createTray = useCallback((scene) => {
        const group = new THREE.Group();
        const woodTexture = makeWoodTexture();
        const wood = new THREE.MeshStandardMaterial({ map: woodTexture, roughness: 0.64, metalness: 0.04 });
        const railH = 46, railW = 52, baseTop = -18;
        const base = new THREE.Mesh(new THREE.BoxGeometry(WORLD.width + railW * 2, 40, WORLD.depth + railW * 2), wood);
        base.position.set(0, baseTop - 20, 0);
        base.castShadow = true; base.receiveShadow = true;
        group.add(base);
        const railY = baseTop + railH / 2;
        const rails = [
          { size: [railW, railH, WORLD.depth + railW * 2], pos: [-(WORLD.width / 2 + railW / 2), railY, 0] },
          { size: [railW, railH, WORLD.depth + railW * 2], pos: [(WORLD.width / 2 + railW / 2), railY, 0] },
          { size: [WORLD.width + railW * 2, railH, railW], pos: [0, railY, -(WORLD.depth / 2 + railW / 2)] },
          { size: [WORLD.width + railW * 2, railH, railW], pos: [0, railY, (WORLD.depth / 2 + railW / 2)] }
        ];
        rails.forEach((rail) => {
          const mesh = new THREE.Mesh(new THREE.BoxGeometry(...rail.size), wood);
          mesh.position.set(...rail.pos);
          mesh.castShadow = true; mesh.receiveShadow = true;
          group.add(mesh);
        });
        scene.add(group);
      }, []);

      const applyEnvironment = useCallback((light, weather) => {
        lightModeRef.current = light;
        weatherModeRef.current = weather;
        const env = envRef.current;
        if (!env) return;
        const palette = resolveEnvironmentPalette(light, weather);
        env.ambient.color.set(palette.ambientSky);
        env.ambient.groundColor.set(palette.ambientGround);
        env.ambient.intensity = palette.ambientIntensity;
        env.sun.color.set(palette.sunColor);
        env.sun.intensity = palette.sunIntensity;
        env.fill.color.set(palette.fillColor);
        env.fill.intensity = palette.fillIntensity;
        env.renderer.toneMappingExposure = palette.exposure;
        if (env.waterMaterial) env.waterMaterial.envMapIntensity = palette.waterEnv;
        if (light === "night") {
          env.sun.position.set(420, 680, -420);
        } else {
          env.sun.position.set(-420, 760, 360);

        const snowOn = weather === "snow";
        env.rain.object.visible = rainOn;
        env.snow.object.visible = snowOn;
        env.rain.material.opacity = rainOn ? palette.particleOpacity * 0.78 : 0;
        env.snow.material.opacity = snowOn ? palette.particleOpacity : 0;
        env.rain.material.color.set(light === "night" ? "#a9c3e2" : "#c4dcec");
        env.snow.material.color.set(light === "night" ? "#dce7ff" : "#ffffff");
      }, []);

      const initScene = useCallback(() => {
        const mount = mountRef.current;
        if (!mount || rendererRef.current) return;
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(window.devicePixelRatio || 1);
        renderer.setClearColor(0x000000, 0);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.96;
        mount.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = null;
        const camera = new THREE.PerspectiveCamera(42, 1, 1, 5000);
        const ambient = new THREE.HemisphereLight("#fff8e8", "#a57a48", 0.58);
        scene.add(ambient);
        const sun = new THREE.DirectionalLight("#fff0c8", 0.82);
        sun.position.set(-420, 760, 360);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.left = -900; sun.shadow.camera.right = 900;
        sun.shadow.camera.top = 700; sun.shadow.camera.bottom = -700;
        scene.add(sun);
        const fill = new THREE.DirectionalLight("#bde7ff", 0.2);
        fill.position.set(520, 420, -520);
        scene.add(fill);
        createTray(scene);
        terrainRef.current = createTerrain();
        const terrainMesh = terrainRef.current.mesh;
        scene.add(terrainMesh);

        const sideSand = makeSandSideTexture();
        const skirtMaterial = new THREE.MeshStandardMaterial({
          map: sideSand.colorTexture,
          bumpMap: sideSand.bumpTexture,
          bumpScale: 1.8,
          color: "#ffffff",
          roughness: 0.98,
          metalness: 0,
          side: THREE.DoubleSide
        });
        const positions = [];
        const uvs = [];
        const indices = [];
        const topVertexIndices = [];
        const terrainIndices = [];
        const bottomY = -72;
        const cols = WORLD.segX + 1;
        const dx = WORLD.width / WORLD.segX;
        const dz = WORLD.depth / WORLD.segZ;
        const addSkirtStrip = (count, pointOf, terrainIndexOf, uRepeat) => {
          const startVertex = positions.length / 3;
          for (let i = 0; i < count; i += 1) {
            const p = pointOf(i);
            const sourceIndex = terrainIndexOf(i);
            const topY = terrainRef.current.heights[sourceIndex];
            const vertexIndex = positions.length / 3;
            positions.push(p.x, topY, p.z, p.x, bottomY, p.z);
            const u = (i / Math.max(1, count - 1)) * uRepeat;
            // Full texture height is dedicated to the cut face: top at v=1,
            // bottom at v=0. This avoids re-using the top-down sand gradient.
            uvs.push(u, 1, u, 0);
            topVertexIndices.push(vertexIndex);
            terrainIndices.push(sourceIndex);
          }
          for (let i = 0; i < count - 1; i += 1) {
            const a = startVertex + i * 2;
            const b = a + 1;
            const c = a + 2;
            const d = a + 3;
            indices.push(a, b, c, c, b, d);
          }
        };
        addSkirtStrip(cols, (i) => ({ x: -WORLD.width / 2 + i * dx, z: WORLD.depth / 2 + 0.02 }), (i) => WORLD.segZ * cols + i, 7);
        addSkirtStrip(cols, (i) => ({ x: -WORLD.width / 2 + i * dx, z: -WORLD.depth / 2 - 0.02 }), (i) => i, 7);
        addSkirtStrip(WORLD.segZ + 1, (i) => ({ x: -WORLD.width / 2 - 0.02, z: -WORLD.depth / 2 + i * dz }), (i) => i * cols, 4);
        addSkirtStrip(WORLD.segZ + 1, (i) => ({ x: WORLD.width / 2 + 0.02, z: -WORLD.depth / 2 + i * dz }), (i) => i * cols + WORLD.segX, 4);
        const skirtGeometry = new THREE.BufferGeometry();
        skirtGeometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        skirtGeometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
        skirtGeometry.setIndex(indices);
        skirtGeometry.computeVertexNormals();
        const skirtMesh = new THREE.Mesh(skirtGeometry, skirtMaterial);
        skirtMesh.receiveShadow = true;
        skirtMesh.castShadow = true;
        scene.add(skirtMesh);
        edgeSkirtRef.current = { geometry: skirtGeometry, topVertexIndices, terrainIndices };
        const waterColor = makeWaterTexture();
        waterColorRef.current = waterColor;
        const waterNormal = makeWaterNormalMap();
        waterNormalRef.current = waterNormal;
        const waterSurface = new THREE.Mesh(
          new THREE.PlaneGeometry(WORLD.width - 6, WORLD.depth - 6),
          new THREE.MeshPhysicalMaterial({
            color: "#ffffff",
            map: waterColor,
            roughness: 0.22,
            metalness: 0.12,
            clearcoat: 0.9,
            clearcoatRoughness: 0.12,
            envMap: makeSkyCubeTexture(),
            envMapIntensity: 0.42,
            normalMap: waterNormal,
            normalScale: new THREE.Vector2(0.26, 0.26),
            emissive: new THREE.Color("#05263d"),
            emissiveIntensity: 0.1
          })
        );
        waterSurface.rotation.x = -Math.PI / 2;
        waterSurface.position.y = -16;
        waterSurface.receiveShadow = true;
        waterSurface.name = "water-surface";
        scene.add(waterSurface);
        updateTerrainGeometry();

        const ring = new THREE.Mesh(
          new THREE.RingGeometry(42, 50, 48),
          new THREE.MeshBasicMaterial({ color: "#54a6d2", transparent: true, opacity: 0.78, side: THREE.DoubleSide })
        );
        ring.rotation.x = -Math.PI / 2;
        ring.visible = false;
        scene.add(ring);
        selectionRingRef.current = ring;

        const brushCursor = new THREE.Group();
        const brushFill = new THREE.Mesh(
          new THREE.CircleGeometry(0.94, 72),
          new THREE.MeshBasicMaterial({ color: "#c1772a", transparent: true, opacity: 0.06, depthTest: false, depthWrite: false, side: THREE.DoubleSide, toneMapped: false })
        );
        const brushEdge = new THREE.Mesh(
          new THREE.RingGeometry(0.94, 1, 72),
          new THREE.MeshBasicMaterial({ color: "#a35f22", transparent: true, opacity: 0.9, depthTest: false, depthWrite: false, side: THREE.DoubleSide, toneMapped: false })
        );
        brushFill.rotation.x = -Math.PI / 2;
        brushEdge.rotation.x = -Math.PI / 2;
        brushFill.renderOrder = 30;
        brushEdge.renderOrder = 31;
        brushCursor.add(brushFill, brushEdge);
        brushCursor.visible = false;
        scene.add(brushCursor);
        brushCursorRef.current = brushCursor;

        const rainField = createRainField();
        const snowField = createSnowField();
        rainField.object.visible = false;
        snowField.object.visible = false;
        scene.add(rainField.object);
        scene.add(snowField.object);
        const envClock = new THREE.Clock();

        rendererRef.current = renderer;
        sceneRef.current = scene;
        cameraRef.current = camera;
        envRef.current = {
          renderer, ambient, sun, fill,
          rain: rainField, snow: snowField,
          waterMaterial: waterSurface.material,
          clock: envClock
        };
        applyEnvironment(lightModeRef.current, weatherModeRef.current);

        const fitCameraDistance = () => {
          const state = cameraStateRef.current;
          const polar = clamp(state.polar, 0.18, 1.32);
          const azimuth = state.azimuth;
          const overlayPanels = window.innerWidth >= 1024;
          const safeWidth = overlayPanels
            ? Math.max(360, mount.clientWidth - 204 - 250 - 64)
            : mount.clientWidth;
          const safeAspect = safeWidth / Math.max(320, mount.clientHeight);
          const previousAspect = camera.aspect;
          camera.aspect = safeAspect;
          camera.updateProjectionMatrix();
          const corners = [];
          const railW = 58;
          const halfW = WORLD.width / 2 + railW;
          const halfD = WORLD.depth / 2 + railW;
          for (const x of [-halfW, halfW]) {
            for (const y of [-82, 10]) {
              for (const z of [-halfD, halfD]) {
                corners.push(new THREE.Vector3(x, y, z));
              }
            }
          }
          let low = 420;
          let high = 6200;
          for (let i = 0; i < 22; i += 1) {
            const mid = (low + high) / 2;
            camera.position.set(
              mid * Math.sin(polar) * Math.sin(azimuth),
              mid * Math.cos(polar),
              mid * Math.sin(polar) * Math.cos(azimuth)
            );
            camera.lookAt(0, -24, 0);
            camera.updateMatrixWorld();
            let maxNdc = 0;
            corners.forEach((corner) => {
              const projected = corner.clone().project(camera);
              maxNdc = Math.max(maxNdc, Math.abs(projected.x), Math.abs(projected.y));
            });
            if (maxNdc > 0.92) low = mid;
            else high = mid;
          }
          cameraBaseRef.current = high;
          camera.aspect = previousAspect;
          camera.updateProjectionMatrix();
        };

        const resize = () => {
          const rect = mount.getBoundingClientRect();
          const width = Math.max(320, Math.floor(rect.width));
          const height = Math.max(320, Math.floor(rect.height));
          renderer.setSize(width, height, false);
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
          fitCameraDistance();
          updateCamera();
        };
        resize();
        const observer = new ResizeObserver(resize);
        observer.observe(mount);

        const animate = () => {
          const environment = envRef.current;
          const delta = environment ? Math.min(environment.clock.getDelta(), 0.05) : 0.016;
          const orbitTarget = orbitTargetRef.current;
          if (orbitTarget) {
            const state = cameraStateRef.current;
            const azimuthGap = orbitTarget.azimuth - state.azimuth;
            const polarGap = orbitTarget.polar - state.polar;
            if (Math.abs(azimuthGap) < 0.0006 && Math.abs(polarGap) < 0.0006) {
              state.azimuth = orbitTarget.azimuth;
              state.polar = orbitTarget.polar;
              orbitTargetRef.current = null;
            } else {
              state.azimuth += azimuthGap * 0.18;
              state.polar += polarGap * 0.18;
            }
            updateCamera();
          }
          const waterColor = waterColorRef.current;
          if (waterColor) {
            waterColor.offset.x = (waterColor.offset.x + 0.00055) % 1;
            waterColor.offset.y = (waterColor.offset.y + 0.00028) % 1;
          }
          const waterNormal = waterNormalRef.current;
          if (waterNormal) {
            waterNormal.offset.x = (waterNormal.offset.x + 0.0011) % 1;
            waterNormal.offset.y = (waterNormal.offset.y + 0.00055) % 1;
          }
          updateSelectionRing();
          if (environment) {
            environment.rain.update(delta);
            environment.snow.update(delta);
          }
          renderer.render(scene, camera);
          renderer.__frame = requestAnimationFrame(animate);
        };
        animate();
        setSceneReady(true);
        return () => {
          observer.disconnect();
          cancelAnimationFrame(renderer.__frame);
          renderer.dispose();
          mount.removeChild(renderer.domElement);
        };
      }, [applyEnvironment, createTerrain, createTray, updateCamera, updateSelectionRing, updateTerrainGeometry]);

      useEffect(() => {
        const cleanup = initScene();
        return cleanup;
      }, [initScene]);

      useEffect(() => {
        applyEnvironment(lightMode, weatherMode);
      }, [applyEnvironment, lightMode, weatherMode, sceneReady]);

      useEffect(() => {
        const scene = sceneRef.current;
        if (!scene) return;
        const sprites = spritesRef.current;
        const activeIds = new Set(items.map((item) => item.id));
        Array.from(sprites.entries()).forEach(([id, sprite]) => {
          if (!activeIds.has(id)) {
            scene.remove(sprite);
            sprites.delete(id);
          }
        });
        items.forEach((item) => {
          let sprite = sprites.get(item.id);
          if (!sprite) {
            sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: getIconTexture(item.icon), transparent: true, depthWrite: false }));
            sprite.userData.itemId = item.id;
            sprites.set(item.id, sprite);
            scene.add(sprite);
            if (item.image) {
              getAssetTexture(item.image, (texture) => {
                if (sprite.material) {
                  sprite.material.map = texture;
                  sprite.material.needsUpdate = true;
                }
              });
            }
          }
          const size = 132 * item.scale;
          sprite.scale.set(size, size, 1);
          sprite.material.rotation = (item.rotation * Math.PI) / 180;
          sprite.position.set(item.x, heightAt(item.x, item.z) + size * 0.54, item.z);
        });
        updateSelectionRing();
      }, [items, heightAt, updateSelectionRing, sceneReady]);

      const setPointerFromClient = useCallback((clientX, clientY) => {
        const canvas = rendererRef.current && rendererRef.current.domElement;
        if (!canvas) return false;
        const rect = canvas.getBoundingClientRect();
        pointerRef.current.x = ((clientX - rect.left) / rect.width) * 2 - 1;
        pointerRef.current.y = -((clientY - rect.top) / rect.height) * 2 + 1;
        raycasterRef.current.setFromCamera(pointerRef.current, cameraRef.current);
        return true;
      }, []);
      const intersectTerrain = useCallback((clientX, clientY) => {
        if (!setPointerFromClient(clientX, clientY) || !terrainRef.current) return null;
        const hits = raycasterRef.current.intersectObject(terrainRef.current.mesh, false);
        return hits.length ? hits[0].point : null;
      }, [setPointerFromClient]);
      const intersectSprite = useCallback((clientX, clientY) => {
        if (!setPointerFromClient(clientX, clientY)) return null;
        const sprites = Array.from(spritesRef.current.values());
        const hits = raycasterRef.current.intersectObjects(sprites, false);
        return hits.length ? hits[0].object : null;
      }, [setPointerFromClient]);

      const applyBrush = useCallback((point, segmentTo = null) => {
        const terrain = terrainRef.current;
        if (!terrain || !point) return;
        const radius = brushSizeRef.current;
        const active = toolRef.current;
        const position = terrain.geometry.attributes.position;
        const base = new THREE.Color();
        const target = new THREE.Color();
        const dx = segmentTo ? segmentTo.x - point.x : 0;
        const dz = segmentTo ? segmentTo.z - point.z : 0;
        const lengthSq = dx * dx + dz * dz;
        for (let i = 0; i < position.count; i += 1) {
          const x = position.getX(i);
          const z = position.getZ(i);
          let sampleX = point.x;
          let sampleZ = point.z;
          if (lengthSq > 0.0001) {
            const t = clamp(((x - point.x) * dx + (z - point.z) * dz) / lengthSq, 0, 1);
            sampleX = point.x + dx * t;
            sampleZ = point.z + dz * t;
          }
          const distance = Math.hypot(x - sampleX, z - sampleZ);
          if (distance > radius) continue;
          const influence = Math.pow(Math.cos((distance / radius) * Math.PI * 0.5), 1.35);
          base.setRGB(terrain.colors[i * 3], terrain.colors[i * 3 + 1], terrain.colors[i * 3 + 2]);
          if (active === "mound") {
            terrain.heights[i] = clamp(terrain.heights[i] + 5.6 * influence, -48, 110);
            target.copy(base).lerp(new THREE.Color(1.16, 1.10, 0.90), 0.34 * influence);
          }
          if (active === "dig") {
            terrain.heights[i] = clamp(terrain.heights[i] - 12.0 * influence, -9, 130);
            target.copy(base).lerp(DIG_COLOR, 0.36 * influence);
          }
          if (active === "water") {
            terrain.heights[i] = clamp(terrain.heights[i] + ((-40) - terrain.heights[i]) * 0.5 * influence, -48, 110);
            target.copy(base);
          }
          if (active === "smooth") {
            terrain.heights[i] = terrain.heights[i] + (0 - terrain.heights[i]) * 0.42 * influence;
            target.copy(base).lerp(new THREE.Color(1, 1, 1), 0.52 * influence);
          }
          terrain.colors[i * 3] = target.r;
          terrain.colors[i * 3 + 1] = target.g;
          terrain.colors[i * 3 + 2] = target.b;
        }
      }, []);
      const applyStrokeSegment = useCallback((from, to) => {
        if (!from || !to) return;
        applyBrush(from, to);
      }, [applyBrush]);

      const onPointerDown = useCallback((event) => {
        event.preventDefault();
        event.currentTarget.setPointerCapture(event.pointerId);
        if (event.button === 2) {
          const state = cameraStateRef.current;
          orbitRef.current = {
            startX: event.clientX,
            startY: event.clientY,

        const oldSize = new THREE.Vector2();

        const exportWidth = 1800, exportHeight = 1140;
        renderer.setSize(exportWidth, exportHeight, false);
        camera.aspect = exportWidth / exportHeight;
        camera.updateProjectionMatrix();
        const state = cameraStateRef.current;
        const polar = clamp(state.polar, 0.18, 1.32);
        const azimuth = state.azimuth;
        const railW = 58;
        const halfW = WORLD.width / 2 + railW;
        const halfD = WORLD.depth / 2 + railW;
        const corners = [];
        for (const x of [-halfW, halfW]) {
          for (const y of [-82, 10]) {
            for (const z of [-halfD, halfD]) {
              corners.push(new THREE.Vector3(x, y, z));
            }
          }
        }
        let low = 420;
        let high = 6200;
        for (let i = 0; i < 22; i += 1) {
          const mid = (low + high) / 2;
          camera.position.set(
            mid * Math.sin(polar) * Math.sin(azimuth),
            mid * Math.cos(polar),
            mid * Math.sin(polar) * Math.cos(azimuth)
          );
          camera.lookAt(0, -24, 0);
          camera.updateMatrixWorld();
          let maxNdc = 0;
          corners.forEach((corner) => {
            const projected = corner.clone().project(camera);
            maxNdc = Math.max(maxNdc, Math.abs(projected.x), Math.abs(projected.y));
          });
          if (maxNdc > 0.94) low = mid;
          else high = mid;
        }
        camera.position.set(
          high * Math.sin(polar) * Math.sin(azimuth),
          high * Math.cos(polar),
          high * Math.sin(polar) * Math.cos(azimuth)
        );

              selectedItem ? h("div", { className: "inspector-bar" },
                h("span", { className: "inspector-name" }, selectedItem.label),
                h("button", { type: "button", title: "逆时针旋转", onClick: () => rotateSelected(-15), className: "inspector-btn" }, "↺"),
                h("button", { type: "button", title: "顺时针旋转", onClick: () => rotateSelected(15), className: "inspector-btn" }, "↻"),
                h("button", { type: "button", title: "缩小", onClick: () => scaleSelected(-0.1), className: "inspector-btn" }, "−"),
                h("button", { type: "button", title: "放大", onClick: () => scaleSelected(0.1), className: "inspector-btn" }, "＋"),
                h("button", { type: "button", title: "取消选中", onClick: () => setSelectedId(null), className: "inspector-btn inspector-close" }, "✕"),
                h("button", { type: "button", onClick: deleteSelected, className: "inspector-delete" }, "移除")
              ) : null
            )
          ),
          h("aside", { className: "studio-panel rail-right" },
            h("div", { className: "panel-head" },
              h("div", null,
                h("div", { className: "panel-kicker" }, "SPECIMENS / 沙具"),
                h("h2", { className: "panel-title" }, "沙具标本")
              ),
              h("div", { className: "count-mark" }, String(visibleIcons.length), h("small", null, "件"))
            ),
            h("p", { className: "panel-note" }, `8 类器物 · 共 ${TEST_ICONS.length} 件`),
            h("div", { className: "specimen-taxonomy", role: "tablist", "aria-label": "沙具器物分类" },
              h("button", {
                key: "all",
                type: "button",
                role: "tab",
                "aria-selected": assetCategory === "全部",
                onClick: () => setAssetCategory("全部"),
                className: `taxon-chip${assetCategory === "全部" ? " active" : ""}`
              }, h("span", null, "全部")),
              SANDPLAY_CATEGORY_DEFS.map((entry) => h("button", {
                key: entry.key,
                type: "button",
                role: "tab",
                "aria-selected": assetCategory === entry.key,
                onClick: () => setAssetCategory(entry.key),
                className: `taxon-chip${assetCategory === entry.key ? " active" : ""}`
              },
                entry.iconImage
                  ? h("img", { src: entry.iconImage, alt: "", draggable: false, className: "taxon-icon", "aria-hidden": "true" })
                  : null,
                h("span", null, entry.short)
              ))
            ),
            h("div", { className: "specimen-grid scroll-soft", ref: specimenGridRef },
              visibleIcons.map((item, index) => h(IconCard, { key: item.id || item.label, data: item, index: index + 1, onAdd: addTestItem }))
            ),
            h("div", { className: "rail-actions" },
              h("div", { className: "action-row" },
                h("button", { type: "button", onClick: undo, className: "ghost-btn" }, "撤销 ",
                  h("span", { className: "mono-value" }, `${undoStack.length}/20`)
                ),
                h("button", { type: "button", onClick: clearAll, className: "ghost-danger" }, "清空")
              ),
              h("button", { type: "button", onClick: finishMaking, className: "primary-btn" },
                h("div", null,
                  h("span", { className: "primary-label" }, "结束制作"),
                  h("span", { className: "primary-meta" }, "代表沙具 · 沙盘描述 · 评估报告")
                ),
                h("span", { className: "primary-arrow" }, "↗")
              )
            )
          )
        ),
        toast ? h("div", { className: "toast" }, toast) : null,
        completionOpen ? h(CompleteModal, {
          items: items,
          busy: submitting,
          error: completionError,
          onClose: () => { if (!submitting) { setCompletionOpen(false); setCompletionError(""); } },
          onSubmit: submitCompletion,
          onSkip: skipCompletion
        }) : null,
        exportModalOpen && exportPayload ? h(ExportModal, {
          payload: exportPayload,
          onClose: () => { setExportModalOpen(false); setExportPayload(null); },
          onToast: showToast
        }) : null
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(h(App));
  </script>
</body>
</html>
